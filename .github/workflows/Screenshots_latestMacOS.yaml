name: Screenshots_latest_MacOS

# Manual only: launches the desktop app on a hosted Mac and photographs
# onboarding, search, settings and the menu-bar icon in light and dark
# (.github/scripts/macos-screenshots.sh).
# On macos-latest (a standard runner: free on public repos; the -large
# labels are billed larger runners, and Intel). The images are the run's
# `macos-latest-screenshots` artifact.
on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 67
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch PDFium and ONNX Runtime binaries
        run: |
          cargo run -p xtask -- fetch-pdfium
          cargo run -p xtask -- fetch-onnxruntime

      - name: Install cliclick
        run: brew install cliclick

      - name: Build
        run: cargo build -p magi-desktop -p magi-cli

      - name: Take screenshots
        run: bash .github/scripts/macos-screenshots.sh
        env:
          OUT: shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-latest-screenshots
          path: shots/
          if-no-files-found: warn
