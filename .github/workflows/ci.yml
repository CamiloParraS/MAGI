name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Fetch PDFium binaries
        run: cargo run -p xtask -- fetch-pdfium

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace
        env:
          MAGI_FAKE_EMBEDDER: "1"

      - name: bindings are up to date
        shell: bash
        run: test -z "$(git status --porcelain -- apps/desktop/src/bindings)" || { git status --porcelain -- apps/desktop/src/bindings; exit 1; }

      - name: pnpm lint
        working-directory: apps/desktop
        run: pnpm lint

      - name: pnpm typecheck
        working-directory: apps/desktop
        run: pnpm typecheck

      - name: pnpm test
        working-directory: apps/desktop
        run: pnpm test

      - name: pnpm tauri build --debug --no-bundle
        working-directory: apps/desktop
        run: pnpm tauri build --debug --no-bundle
