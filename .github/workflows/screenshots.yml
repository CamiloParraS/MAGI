name: Screenshots

# Manual only: launches the desktop app on a hosted Mac and photographs
# onboarding, search and settings in light and dark,
# over a wallpaper, plus search and settings with the blur forced
# (.github/scripts/macos-screenshots.sh).
# The images are the run's `macos-screenshots` artifact.
on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch PDFium and ONNX Runtime binaries
        run: |
          cargo run -p xtask -- fetch-pdfium
          cargo run -p xtask -- fetch-onnxruntime

      - name: Install cliclick
        run: brew install cliclick

      - name: Build
        run: cargo build -p magi-desktop -p magi-cli

      - name: Take screenshots
        run: bash .github/scripts/macos-screenshots.sh
        env:
          OUT: shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: shots/
          if-no-files-found: warn
