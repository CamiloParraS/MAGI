[workspace]
resolver = "2"
members = ["crates/magi-core", "crates/magi-cli", "apps/desktop/src-tauri", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Centralize ALL shared dependency versions here; member crates use `dep = { workspace = true }`.
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
directories = "6.0.0"
toml = "1.1.6"
glob = "0.3.4"
dunce = "1.0.5"
tempfile = "3.27.0"
clap = { version = "4.6.6", features = ["derive"] }
infer = "0.22.0"
ignore = "0.4.33"
isolang = { version = "2.4.0", default-features = false }
whatlang = "0.18.0"
chardetng = "1.0.0"
encoding_rs = "0.8.41"
unicode-normalization = "0.1.25"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
