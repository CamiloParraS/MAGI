[workspace]
resolver = "2"
members = ["crates/magi-core", "crates/magi-cli", "apps/desktop/src-tauri", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Centralize ALL shared dependency versions here; member crates use `dep = { workspace = true }`.
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# IPC types generated for the frontend (SPEC.md §3, §5.7). Pure Rust; runs
# only at `cargo test` time to write apps/desktop/src/bindings/.
ts-rs = "12.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
directories = "6.0.0"
toml = "1.1.6"
glob = "0.3.4"
dunce = "1.0.5"
tempfile = "3.27.0"
# Channels between the indexing threads (SPEC.md §3); std::sync::mpsc cannot select or bound multi-producer queues as needed.
crossbeam-channel = "0.5.17"
# File watching (SPEC.md section 3). Stable releases: notify 9 and debouncer 0.8 are still release candidates.
notify = "8.2.0"
notify-debouncer-full = "0.6.0"
# Available memory and physical cores (SPEC.md section 5.3); only the `system` feature.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# Clean Ctrl-C shutdown for `magi-cli daemon`. Pure Rust over the OS signal APIs.
ctrlc = "3.5.2"
# Thin OS bindings for platform/ (thread priority, power status, drive type). No native library.
libc = "0.2.189"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
clap = { version = "4.6.6", features = ["derive"] }
infer = "0.22.0"
ignore = "0.4.33"
isolang = { version = "2.4.0", default-features = false }
whatlang = "0.18.0"
chardetng = "1.0.0"
encoding_rs = "0.8.41"
unicode-normalization = "0.1.25"
pdfium-render = "0.9.4"
zip = { version = "5.1.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
calamine = "0.36.1"
# HEIC/HEIF decode (SPEC.md §3, ADR-0003). Pure Rust: no native library,
# no LGPL obligation, no per-OS install step. `libheif-rs` is the
# documented fallback if this proves immature.
heic-rs = "0.1.1"
# Codec features match `discovery::classify`'s image extensions exactly, so
# nothing we do not index gets decoder code linked in. HEIC is not here: it
# goes through `heic-rs` (ADR-0003).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
# QR decoding (SPEC.md §3). `default-features = false` drops rxing's own
# `image` feature: we already hold decoded pixels, and that feature pulls a
# second image/png stack that does not currently compile (see
# docs/progress.md). 1D barcodes are one more feature flag (`oned`) when a
# fixture and an eval query ask for them.
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-c-sharp = "0.23.5"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
sha2 = "0.11.0"
blake3 = "1.8.7"
ureq = "3.4.2"
# default-features disabled to drop `download-binaries` (fetches ONNX
# Runtime from a third-party CDN at build time — outside our own
# manifest-controlled downloads) in favor of `load-dynamic`, loading the
# copy `xtask fetch-onnxruntime` vendors and SHA-256-verifies (see
# `xtask/src/main.rs` and ADR-0001).
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-27"] }
ndarray = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.magi-core]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
