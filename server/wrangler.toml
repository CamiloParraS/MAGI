name = "magi-ask"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Never log bodies (plan.md). Invocation logs stay off.
[observability]
enabled = false

[vars]
# Public values. Replace <ref> with the Supabase project ref.
SUPABASE_URL = "https://aklgszmriarobrlkrzcd.supabase.co"
# Takes pictures as well as text (ADR-0014, amended 2026-11-09).
MODEL = "deepseek/deepseek-v4.1-flash"

# Secret, set with: npx wrangler secret put OPENROUTER_API_KEY

[[durable_objects.bindings]]
name = "USAGE"
class_name = "Usage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Usage"]

# Daily keep-alive for the free Supabase project.
[triggers]
crons = ["17 6 * * *"]
